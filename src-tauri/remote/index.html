<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hangar">
<meta name="theme-color" content="#161a2e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<title>Hangar</title>
<style>
:root {
  --night: #161a2e; --panel: #1c2139; --raise: #252b47; --line: #2f3656;
  --moon: #ede9f7; --dim: #9ca0c0; --faint: #686e92;
  --gold: #f2c66d; --live: #6ee7a8; --warn: #ffb25b; --bad: #ff7a8a;
  --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: var(--app-h, 100%); background: var(--night); color: var(--moon);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* Only the lists scroll, never the page: no rubber-banding of the whole app (see also the touch lock). */
html, body { overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; font-size: 16px; color: var(--moon); background: var(--night);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold); }
.hidden { display: none !important; }

/* Layout */
#app { display: flex; flex-direction: column; height: var(--app-h, 100%); }
/* Full-screen layers follow --app-h too (see fitHeight: iOS can report a short viewport). */
.sheet, #dialog, #pair { bottom: auto !important; height: var(--app-h, 100%); top: var(--app-top, 0px) !important; }
/* Keyboard open: it covers the home bar, so the composer sits right on top of the keyboard. */
html.kb { --bottom: 0px; }
/* One screen at a time, like a native app: while a chat or form is open the tab screen behind it
   is not drawn at all (see syncLayers), so nothing back there can scroll, show through or cost frames. */
html.sheet-open #app { display: none; }
header.bar { position: relative; z-index: 1; padding: calc(var(--top) + 10px) 16px 10px; display: flex; align-items: center; gap: 10px;
  background: var(--night); border-bottom: 1px solid var(--line); }
header.bar.drop { animation: drop .2s ease-out; }
@keyframes drop { from { transform: translateY(-100%); } }
@media (prefers-reduced-motion: reduce) { header.bar.drop { animation: none; } }
header.bar h1 { margin: 0; font-size: 22px; font-weight: 700; flex: 1; }
#main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 12px 16px 20px; }
nav.tabs { display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding-bottom: var(--bottom); }
nav.tabs button { flex: 1; padding: 9px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--faint); font-size: 11px; position: relative; }
nav.tabs button.on { color: var(--gold); }
nav.tabs svg { width: 24px; height: 24px; }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--gold); color: var(--night); font-size: 11px; font-weight: 700;
  display: grid; place-items: center; }

/* Bits */
.led { width: 9px; height: 9px; border-radius: 9px; background: var(--line); flex: none; }
.led.on { background: var(--live); box-shadow: 0 0 8px color-mix(in srgb, var(--live) 60%, transparent); }
.led.warn { background: var(--warn); }
.led.bad { background: var(--bad); }
.led.busy { background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { color: var(--dim); font-size: 13px; }
.faint { color: var(--faint); font-size: 12px; }
.clip2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font-size: 12px;
  background: var(--raise); color: var(--dim); white-space: nowrap; }
.chip.gold { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); }
.chip.live { background: color-mix(in srgb, var(--live) 16%, transparent); color: var(--live); }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.chip.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.chip.gpu { background: color-mix(in srgb, #a99bff 18%, transparent); color: #a99bff; }
.btn { height: 40px; padding: 0 16px; border-radius: 10px; background: var(--raise); color: var(--moon); font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.small { height: 34px; padding: 0 12px; font-size: 14px; }
.btn.gold { background: var(--gold); color: var(--night); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .4; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.seg button { flex: 1; height: 32px; border-radius: 8px; color: var(--dim); font-size: 13px; font-weight: 600; }
.seg button.on { background: var(--raise); color: var(--moon); }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 18px 2px 8px; }
h2.sec:first-child { margin-top: 4px; }
.toolrow { padding: 9px 0; border-bottom: 1px solid var(--line); }
.toolrow:last-child { border-bottom: 0; }
.empty { text-align: center; color: var(--faint); padding: 40px 10px; }
.banner { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); border-radius: 10px;
  padding: 8px 12px; font-size: 13px; margin-bottom: 10px; }

/* Meters */
.meter { margin: 8px 0; }
.meter .lab { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); margin-bottom: 4px; }
.meter .lab b { color: var(--moon); font-weight: 600; }
.track { height: 8px; border-radius: 8px; background: var(--raise); overflow: hidden; }
.fill { height: 100%; border-radius: 8px; background: var(--live); transition: width .4s; }
.fill.w { background: var(--warn); } .fill.b { background: var(--bad); }

/* Sheets (chat, forms) */
.sheet { position: fixed; inset: 0; background: var(--night); display: flex; flex-direction: column; z-index: 20; }
.sheet header.bar h1 { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: var(--gold); flex: none; }
.back svg { width: 22px; height: 22px; }
.form { padding: 16px; overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.form label { display: block; font-size: 13px; color: var(--dim); margin: 14px 0 6px; }

/* Chat */
/* The list keeps its own place (see Pin): the browser's scroll anchoring would fight it. */
.msgwrap { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
#msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; overflow-anchor: none; }
.msg { max-width: 88%; margin: 0 0 10px; padding: 9px 12px; border-radius: 16px; word-wrap: break-word; overflow-wrap: anywhere; }
.msg.new { animation: rise .22s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .msg.new { animation: none; } }
/* Shown when new messages arrive while you're reading further up. */
.jump { position: absolute; left: 50%; bottom: 12px; transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  height: 34px; padding: 0 14px; border-radius: 17px; background: var(--raise); border: 1px solid var(--line); color: var(--moon);
  font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.35);
  transition: opacity .18s, transform .18s; }
.jump.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.jump svg { width: 16px; height: 16px; color: var(--gold); }
.msg.user { margin-left: auto; background: color-mix(in srgb, var(--gold) 20%, var(--panel)); border-bottom-right-radius: 5px; }
.msg.assistant { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.msg.pending { opacity: .6; }
.msg .t { font-size: 11px; color: var(--faint); margin-top: 4px; }
.md p { margin: 0 0 .5em; } .md p:last-child { margin-bottom: 0; }
.md code { background: var(--night); padding: .1em .35em; border-radius: 5px; font-size: .9em; }
.md pre { background: var(--night); padding: 8px 10px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; margin: .4em 0; }
.md pre code { background: none; padding: 0; }
.md ul, .md ol { margin: .3em 0 .5em; padding-left: 1.3em; }
.md h3 { font-size: 15px; margin: .6em 0 .3em; }
.md a { color: var(--gold); }
.composer { display: flex; gap: 8px; align-items: flex-end; padding: 8px 12px calc(var(--bottom) + 8px);
  border-top: 1px solid var(--line); background: var(--panel); }
.composer textarea { resize: none; max-height: 140px; min-height: 42px; height: 42px; line-height: 20px; border-radius: 20px; padding: 10px 14px;
  overscroll-behavior: contain; display: block; }
.send { width: 42px; height: 42px; border-radius: 21px; background: var(--gold); color: var(--night); flex: none; display: grid; place-items: center; }
.send:disabled { opacity: .35; }
.send svg { width: 20px; height: 20px; }
.attach { width: 42px; height: 42px; border-radius: 21px; background: var(--raise); color: var(--dim); flex: none; display: grid; place-items: center; }
.attach svg { width: 20px; height: 20px; }
/* Attachments waiting to go with the next message */
.attbar { display: flex; gap: 10px; overflow-x: auto; padding: 12px 12px 4px; background: var(--panel); border-top: 1px solid var(--line); }
.attbar:empty { display: none; }
.attbar:not(:empty) + .composer { border-top: 0; }
.form .attbar { background: none; border: 0; padding: 6px 0 8px; }
.att { position: relative; flex: none; }
.att img { width: 58px; height: 58px; object-fit: cover; border-radius: 10px; display: block; }
.att .fname { height: 58px; max-width: 140px; padding: 0 12px; border-radius: 10px; background: var(--raise); font-size: 12px;
  display: flex; align-items: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .x { position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 12px; background: var(--night);
  border: 1px solid var(--line); color: var(--moon); font-size: 15px; line-height: 1; display: grid; place-items: center; }
.ncrow { display: flex; gap: 8px; align-items: flex-end; }

/* Chat | Terminal */
.modebar { padding: 8px 12px 0; background: var(--night); }
.modebar .seg { margin-bottom: 0; }
.askbar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: color-mix(in srgb, var(--warn) 12%, var(--panel));
  border-top: 1px solid var(--line); color: var(--warn); font-size: 13.5px; }
.askbar span { flex: 1; }
.msg .btn { margin-top: 8px; }
.termwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#termHost { flex: 1; min-height: 0; padding: 6px 4px 2px 8px; overflow: hidden; background: var(--night); }
#termHost .xterm { height: 100%; }
#termHost .xterm-viewport { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.termnote { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px; color: var(--dim);
  background: var(--panel); border-top: 1px solid var(--line); }
.termnote span { flex: 1; }
.termnote.bad { color: var(--bad); }
.keys { display: flex; gap: 6px; padding: 8px 10px; background: var(--panel); border-top: 1px solid var(--line); }
.keys button { flex: 1; min-width: 0; height: 40px; border-radius: 9px; background: var(--raise); color: var(--moon);
  font-size: 14px; font-weight: 600; }
.keys button:active { background: var(--line); }
.keys button.k-enter { flex: 1.5; background: color-mix(in srgb, var(--gold) 22%, var(--raise)); }
.composer input { border-radius: 20px; height: 42px; padding: 0 14px; }

/* Toast + confirm */
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--bottom) + 76px - var(--app-gap, 0px)); z-index: 50; display: flex; justify-content: center; pointer-events: none; }
#toast div { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4); max-width: 100%; }
#toast div.bad { border-color: var(--bad); color: var(--bad); }
#dialog { position: fixed; inset: 0; z-index: 40; background: rgba(5,6,15,.6); display: flex; align-items: flex-end; }
#dialog .box { width: 100%; background: var(--panel); border-radius: 18px 18px 0 0; padding: 18px 16px calc(var(--bottom) + 16px); }
#dialog h3 { margin: 0 0 6px; font-size: 17px; }
#dialog p { margin: 0 0 12px; color: var(--dim); white-space: pre-wrap; }
#dialog .btns .btn { flex: 1; }

/* Pair */
#pair { position: fixed; inset: 0; z-index: 60; background: var(--night); display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px; text-align: center; }
#pair img { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 14px; }
#pair h1 { margin: 0 0 6px; font-size: 24px; }
#pair p { color: var(--dim); margin: 0 0 18px; max-width: 320px; }
#pair input { text-align: center; font-size: 30px; letter-spacing: .35em; max-width: 260px; font-variant-numeric: tabular-nums; }
#pair .btn { margin-top: 14px; width: 260px; }
</style>
</head>
<body>
<div id="app">
  <header class="bar"><h1 id="heading">Chats</h1><span id="conn" class="led" title="Connection"></span><span id="headAct"></span></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chats<span class="badge hidden" id="b-chats"></span></button>
    <button data-tab="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Tools</button>
    <button data-tab="pc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>PC</button>
  </nav>
</div>
<div id="toast"></div>
<div id="dialog" class="hidden"></div>
<div id="pair" class="hidden">
  <img src="/icon.png" alt="">
  <h1>Pair with Hangar</h1>
  <p>On the PC, open Hangar: <b>Settings &rsaquo; Phone remote &rsaquo; Pair a phone</b>, then type the 6-digit code.</p>
  <input id="pairCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
  <button class="btn gold" id="pairBtn">Pair</button>
  <p class="faint" id="pairMsg" style="margin-top:14px"></p>
</div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  plus: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
  clip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>',
};

// ---------- Storage (per-device login) ----------
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};
const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;

// iOS Home Screen apps (black-translucent status bar) can report a viewport shorter than the
// screen by about the top safe area, which left a dead band under the tab bar.
// Stretch to the real screen height then, but only with the keyboard closed, so the composer
// still rides above it. A correct viewport makes this a no-op.
// With the keyboard open, iOS keeps the layout full height and pans the page to reach the
// focused box: the composer floated an inch above the keyboard, then the whole sheet slid up
// and the header vanished. So while it's open, the app is exactly the visible
// area above the keyboard, pinned to it (--app-top follows the pan), with no home-bar padding.
// On a real iPhone innerHeight shrinks WITH the keyboard, so comparing visualViewport to it
// never saw the keyboard (the first fix passed a desktop test and did nothing on the phone).
// Instead remember the tallest height seen while nothing is being typed, and call it a keyboard
// when a text box has focus and the visible area is well below that.
// Timing (measured in the iOS 26 Simulator): iOS reports the keyboard's final size as
// its animation STARTS, then scrolls the page so the composer clears it, in step with the keyboard.
// Shrinking the app right away moved it twice: the composer shot up to the top of the screen with
// a blank gap below for about half a second, then dropped back. So on the way in, the app keeps
// its full height until iOS's scroll has landed (or 600 ms), riding up with the keyboard like a
// native view, and only then becomes the visible area. Nothing moves at that switch except the
// header coming back: the list keeps its bottom in place (see Pin).
let restH = 0, layoutH = 0, kbTimer = 0, kbWaited = false, panTimer = 0;
// fitHeight runs on every page and viewport scroll event; writing a variable on <html> restyles the
// whole page, so only real changes are written.
const appVars = {};
function setVar(k, v) { if (appVars[k] !== v) { appVars[k] = v; document.documentElement.style.setProperty(k, v); } }
const typing = () => { const a = document.activeElement; return !!a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && !/^(checkbox|radio|button|submit|range)$/i.test(a.type))); };
function fitHeight() {
  let h = window.innerHeight, gap = 0, top = 0;
  const vv = window.visualViewport;
  const visible = vv ? vv.height : h;
  if (!typing()) restH = Math.max(visible, h);
  else if (!restH) restH = Math.max(visible, h, document.documentElement.clientHeight);
  // A keyboard is far taller than any toolbar change; 60 also catches the slim bar iOS keeps when a
  // hardware keyboard takes over (measured: 100 px).
  const keyboard = !!vv && typing() && visible < restH - 60;
  const root = document.documentElement;
  if (keyboard) {
    const landed = vv.offsetTop + vv.height >= layoutH - 4; // the visible area reaches the app's bottom edge
    if (!root.classList.contains("kb") && !landed && !kbWaited) {
      if (!kbTimer) kbTimer = setTimeout(() => { kbTimer = 0; kbWaited = true; fitHeight(); }, 600);
      return;
    }
    h = Math.round(vv.height);
    top = Math.max(0, Math.round(vv.offsetTop));
  } else {
    clearTimeout(kbTimer); kbTimer = 0; kbWaited = false;
    // The page itself never scrolls; an offset left over from a keyboard that went away while the
    // box kept focus (hardware keyboard, dictation) would leave the header off the top. Checked
    // again a moment later so it never fights iOS's own scroll while a keyboard is coming up.
    if (window.scrollY || (vv && vv.offsetTop)) {
      clearTimeout(panTimer);
      panTimer = setTimeout(() => {
        const v = window.visualViewport;
        const kbUp = typing() && v && v.height < restH - 60;
        if (!kbUp && (window.scrollY || (v && v.offsetTop))) { window.scrollTo(0, 0); fitHeight(); }
      }, 400);
    }
    if (standalone) {
      const full = matchMedia("(orientation: portrait)").matches ? screen.height : screen.width;
      if (full > h && full - h < 120) { gap = full - h; h = full; }
    }
    layoutH = h;
  }
  // The header was carried off the top by iOS's scroll: slide it back in rather than pop it.
  if (keyboard && top > 0 && !root.classList.contains("kb")) {
    document.querySelectorAll("header.bar").forEach(b => {
      b.classList.remove("drop"); void b.offsetWidth; b.classList.add("drop");
      b.addEventListener("animationend", () => b.classList.remove("drop"), { once: true });
    });
  }
  setVar("--app-h", h + "px");
  setVar("--app-gap", gap + "px");
  setVar("--app-top", top + "px");
  if (root.classList.contains("kb") !== keyboard) { root.classList.toggle("kb", keyboard); touchLock(keyboard); }
  if (kbDebug) {
    kbDebug.textContent = `inner ${window.innerHeight} client ${root.clientHeight} vv ${vv ? Math.round(vv.height) : "-"}`
      + ` top ${vv ? Math.round(vv.offsetTop) : "-"} rest ${Math.round(restH)} screen ${screen.height}`
      + ` typing ${typing()} kb ${keyboard} app-h ${h} scrollY ${Math.round(scrollY)}`;
  }
}
// #kbdebug on the URL shows the live numbers (screenshot it if the keyboard layout misbehaves).
let kbDebug = null;
if (location.hash.includes("kbdebug")) {
  kbDebug = document.createElement("div");

function ago(ms) {

// ---------- API ----------
async function api(path, body, method) {
  const opt = { method: method || (body !== undefined ? "POST" : "GET"), headers: { Authorization: "Bearer " + token } };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  return request(path, opt);
}
// fetch with Hangar's error handling: a JSON reply, or an Error with Hangar's message.
async function request(path, opt) {
  let r;
  try { r = await fetch(path, opt); } catch (e) { setConn(false); throw new Error("Can't reach Hangar. Is the PC on and Phone remote switched on?"); }
  if (r.status === 401 && path !== "/api/pair") { setConn(true); logout(); throw new Error("This phone isn't paired anymore."); }
  const data = await r.json().catch(() => ({}));
  // A 5xx or 403 without Hangar's own error: something between the phone and Hangar answered instead.
  if (!data.error && (r.status >= 500 || r.status === 403)) {
    setConn(false);
    throw new Error("Hangar isn't answering: the PC may be off, Hangar closed, or this phone is off the home Wi-Fi.");
  }
  setConn(true);
  if (!r.ok) { const e = new Error(data.error || ("Error " + r.status)); e.status = r.status; e.data = data; throw e; }
  return data;
}
function setConn(ok) { $("#conn").className = "led " + (ok ? "on" : "bad"); }

async function doPair(code) {

    const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, name }) });

// ---------- Markdown (small, safe: everything escaped first) ----------
function md(src) {
  const blocks = [];
  let s = String(src || "").replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => { blocks.push(code); return `\u0000${blocks.length - 1}\u0000`; });
  s = esc(s);
  const inline = t => t
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = [];
  let list = null;
  const flush = () => { if (list) { out.push(`<${list.t}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.t}>`); list = null; } };
  for (const para of s.split(/\n{2,}/)) {
    const lines = para.split("\n");
    let buf = [];
    const pushBuf = () => { if (buf.length) { out.push(`<p>${inline(buf.join("<br>"))}</p>`); buf = []; } };
    for (const line of lines) {
      const m = line.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
      const h = line.match(/^#{1,4}\s+(.*)$/);
      const code = line.match(/^\u0000(\d+)\u0000$/);
      if (code) { pushBuf(); flush(); out.push(`<pre><code>${esc(blocks[+code[1]])}</code></pre>`); continue; }
      if (h) { pushBuf(); flush(); out.push(`<h3>${inline(h[1])}</h3>`); continue; }
      if (m) {
        pushBuf();
        const t = /\d/.test(m[1]) ? "ol" : "ul";
        if (!list || list.t !== t) { flush(); list = { t, items: [] }; }
        list.items.push(m[2]);
        continue;
      }
      if (list && /^\s{2,}\S/.test(line)) { list.items[list.items.length - 1] += " " + line.trim(); continue; }
      flush();
      buf.push(line);
    }
    pushBuf();
    flush();
  }
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre><code>${esc(blocks[+i])}</code></pre>`);
}

// ---------- Pin: keeps the conversation where you left it ----------
// Native chat behaviour: at the bottom, it stays at the bottom through new messages, replies that
// grow, the keyboard opening or closing and the composer growing. Scrolled up, what you are
// reading stays still and a "New messages" pill appears instead. Size changes are fixed up in a
// ResizeObserver, which runs before the frame is painted, so nothing visibly jumps.
const pin = {
  box: null, stuck: true, dist: 0, h: 0, touching: false, pinnedAt: 0, touchedAt: 0,
  attach(box) {
    this.box = box;
    this.h = box.clientHeight;
    box.addEventListener("scroll", () => {
      // A scroll caused by the box changing size (keyboard, composer) is handled by the observer.
      if (box.clientHeight !== this.h) return;
      // WebKit can deliver a stale position right after we pinned to the bottom (it put the list
      // back 60 px up after the composer grew, about 1 time in 2 in tests). Nobody touched the
      // list since, so it isn't you scrolling: pin again.
      if (this.stuck && !this.touching && this.touchedAt < this.pinnedAt && performance.now() - this.pinnedAt < 300
          && box.scrollHeight - box.scrollTop - box.clientHeight >= 2) { this.bottom(); return; }
      this.measure();
      if (this.stuck) this.pill(false);
    }, { passive: true });
    box.addEventListener("touchstart", () => { this.touching = true; this.touchedAt = performance.now(); }, { passive: true });
    box.addEventListener("wheel", () => { this.touchedAt = performance.now(); }, { passive: true });
    const up = () => { this.touching = false; this.touchedAt = performance.now(); this.measure(); };
    box.addEventListener("touchend", up, { passive: true });
    box.addEventListener("touchcancel", up, { passive: true });
    new ResizeObserver(() => {
      if (box.clientHeight === this.h) return;
      this.h = box.clientHeight;
      if (this.stuck) this.bottom();
      else box.scrollTop = box.scrollHeight - box.clientHeight - this.dist; // keep the bottom edge's content in place
      this.measure();
    }).observe(box);
  },
  bottom() { this.box.scrollTop = this.box.scrollHeight; this.pinnedAt = performance.now(); },
  measure() {
    const b = this.box;
    this.dist = Math.max(0, b.scrollHeight - b.scrollTop - b.clientHeight);
    this.stuck = this.dist < 48;
  },
  toBottom(smooth) {
    const b = this.box;
    if (!b) return;
    this.stuck = true;
    this.pill(false);
    if (smooth) b.scrollTo({ top: b.scrollHeight, behavior: "smooth" });
    else this.bottom();
    this.dist = 0;
  },
  pill(on) { $("#msgJump")?.classList.toggle("on", !!on); },
  // Run a change to the list. Whatever you were looking at stays put (by message, not by pixel),
  // unless you were at the bottom, where it follows the newest message. fn returns true when
  // messages were added, which shows the pill if you're scrolled up.
  change(fn) {
    const b = this.box;
    const follow = this.stuck && !this.touching;
    const top = b.getBoundingClientRect().top;
    let ref = null, refY = 0;
    if (!follow) {
      ref = [...b.querySelectorAll("#msgList > .msg")].find(m => m.getBoundingClientRect().bottom > top + 1) || null;
      if (ref) refY = ref.getBoundingClientRect().top;
    }
    const added = fn();
    if (follow) this.bottom();
    else if (ref && ref.isConnected) b.scrollTop += ref.getBoundingClientRect().top - refY;
    this.h = b.clientHeight;
    if (follow) { this.stuck = true; this.dist = 0; } else this.measure();
    if (!this.stuck && added) this.pill(true);
  },
};

// In iOS Safari a swipe in the chat that started at its top or bottom edge, or any swipe while the

// the iOS 26.5 Simulator: the whole app bounced 129 px; with the keyboard up the list

// The list is patched, never rebuilt: each message keeps its element (keyed by its place in the

    const r = await api("/api/chat?" + q);

  replyBusy = true;
  canSendReply();
  await prepping.reply; // photos still being shrunk
  const text = ta.value.trim();
  const files = S.attach.reply.slice();
  if ((!text && !files.length) || !ch.id || !ch.session_id) {
    replyBusy = false;

    return;
  }
  const p = { text: attachBlock(text, files.map(f => f.name)), state: files.length ? `Uploading 1 of ${files.length}…` : "Sending…" };
  ch.pending.push(p);

  paintMsgs(true);
  const restore = () => { if (!ta.value.trim()) ta.value = text; };

    paths = await uploadAll(files, (i, n) => { p.state = `Uploading ${i} of ${n}…`; paintMsgs(true); });
  } catch (e) {

    if (r.id && r.id !== ch.id) ch.id = r.id;
    if (r.session_id && r.session_id !== ch.session_id) { ch.session_id = r.session_id; ch.stamp = ""; }

    loadChat(false);
  } catch (e) {
    p.state = "Not sent: " + e.message;

  }

// Photos are re-encoded here (JPEG, long edge at most 2048 px, which also drops EXIF and GPS),
// uploaded only when the message is sent, and listed by their path on the PC at the end of it.
const MAX_FILES = 6, MAX_BYTES = 25 * 1024 * 1024, IMG_EDGE = 2048;
const ACCEPT = "image/*,application/pdf,text/plain,.md,.csv,.json,.log,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.rtf";

    + `<input type="file" multiple accept="${ACCEPT}" class="hidden" data-attach-input="${which}">`;
}

    for (const file of files.slice(0, Math.max(0, room))) {
      const { name, blob } = await prepareFile(file);
      if (blob.size > MAX_BYTES) { toast(`${name} is over 25 MB.`, true); continue; }
      const thumb = /^image\//.test(blob.type) ? URL.createObjectURL(blob) : "";

async function prepareFile(file) {
  const name = file.name || "file";

  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, IMG_EDGE / Math.max(bmp.width, bmp.height)); // never upscale
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bmp.width * scale));

    g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const blob = await new Promise((ok, bad) => c.toBlob(b => (b ? ok(b) : bad(new Error("encode"))), "image/jpeg", 0.85));
    return { name: name.replace(/\.[^.]*$/, "") + ".jpg", blob };

    <div class="ncrow">${attachButton("fresh")}<textarea id="ncPrompt" rows="6" placeholder="Tell Claude what to do"></textarea></div>`,
    async el => {
      const dir = el.querySelector("#ncDir").value || el.querySelector("#ncOther").value.trim();
      await prepping.fresh; // photos still being shrunk
      const text = el.querySelector("#ncPrompt").value.trim();
      const files = S.attach.fresh.slice();
      if (!text && !files.length) { toast("Write the first message.", true); return false; }
      const name = el.querySelector("#ncName").value.trim();
      const go = el.querySelector("[data-go]");
      let paths;
      try { paths = await uploadAll(files, (i, n) => { go.textContent = `Uploading ${i} of ${n}…`; }); }
      finally { go.textContent = "Start"; } // on failure the sheet stays open with the text and attachments
      const prompt = attachBlock(text, paths);
      const r = await api("/api/chat/new", { cwd: dir, name, prompt });
      clearAttach("fresh", files);
      openNewChat(r.id, dir, name, prompt);
      toast("Started.");
      refresh();
    }, "Start");
  el.querySelector("#ncDir").onchange = e => el.querySelector("#ncOther").classList.toggle("hidden", e.target.value !== "");
  wireAttach(el, "fresh");
  el.querySelector(".back").onclick = () => { clearAttach("fresh"); el.remove(); };
}

function renderTools() {
  const m = $("#main");
  if (!S.tools) { m.innerHTML = `<div class="empty">Loading…</div>`; return; }
  const q = S.toolQuery.toLowerCase();
  const hit = t => (!S.runningOnly || t.running) && (!q || (t.name + " " + t.description + " " + t.id).toLowerCase().includes(q));
  // Tools merged into a hub app (part_of) sit on the hub's row; a search still finds them.
  const byId = new Map(S.tools.map(t => [t.id, t]));
  const hub = t => t.part_of && t.part_of !== t.id ? byId.get(t.part_of) : null;
  const inside = t => S.tools.filter(c => c.part_of === t.id && c.id !== t.id);
  const running = S.tools.filter(t => t.running).length;
  let html = `<input id="toolQ" type="search" placeholder="Search ${S.tools.length} tools" value="${esc(S.toolQuery)}" style="margin-bottom:10px">
    <div class="seg"><button data-ro="0" class="${S.runningOnly ? "" : "on"}">All</button><button data-ro="1" class="${S.runningOnly ? "on" : ""}">Running ${running}</button></div>`;
  for (const th of S.themes) {
    const list = S.tools.filter(t => t.theme === th.id && hit(t) && (q || !hub(t)));
    if (!list.length) continue;
    html += `<h2 class="sec">${esc(th.name)}</h2><div class="card" style="padding:4px 14px">` + list.map(t => {
      const act = t.running
        ? (t.can_stop ? `<button class="btn small" data-tool="${esc(t.id)}" data-a="stop">Stop</button>` : `<span class="faint">Running</span>`)
        : (t.can_start ? `<button class="btn small gold" data-tool="${esc(t.id)}" data-a="start">Start</button>` : `<span class="faint">Off</span>`);
      const open = t.phone_open ? `<button class="btn small gold" data-tool="${esc(t.id)}" data-a="open">Open</button>` : "";
      return `<div class="row toolrow">
        <span class="led ${t.running ? "on" : ""}"></span>
        <div class="grow"><div class="title">${esc(t.name)} ${t.gpu ? `<span class="chip gpu">GPU</span>` : ""}</div>
        ${hub(t) ? `<div class="faint">Inside ${esc(hub(t).name)}</div>` : t.description ? `<div class="faint clip2">${esc(t.description)}</div>` : ""}
        ${inside(t).length ? `<div class="faint" style="font-size:12px">Includes: ${inside(t).map(c => esc(c.name)).join(", ")}</div>` : ""}</div>${open}${act}</div>`;
    }).join("") + `</div>`;
  }
  m.innerHTML = html;
  const qi = $("#toolQ");
  qi.oninput = () => { S.toolQuery = qi.value; const pos = qi.selectionStart; renderTools(); const n = $("#toolQ"); n.focus(); n.setSelectionRange(pos, pos); };
  m.onclick = async e => {
    const ro = e.target.closest("[data-ro]");
    if (ro) { S.runningOnly = ro.dataset.ro === "1"; return renderTools(); }
    const b = e.target.closest("[data-tool]");
    if (!b) return;
    const t = S.tools.find(x => x.id === b.dataset.tool);
    const action = b.dataset.a;
    if (action === "open") {
      b.disabled = true;
      b.textContent = "Opening…";
      if (!(await openTool(t.id, "/", true))) { b.disabled = false; b.textContent = "Open"; }
      return;
    }
    let body = {};
    if (action === "start" && t.gpu && !(await confirmBox({ title: `Start ${t.name}?`, body: "This one uses the GPU.", yes: "Start" }))) return;
    if (action === "stop") {
      if (!t.stoppable) {
        if (!(await confirmBox({ title: `Stop ${t.name}?`, body: t.notes || "Hangar marks this one as not safe to stop.", yes: "Stop anyway", danger: true }))) return;
        body.confirmed = true;
      } else if (!(await confirmBox({ title: `Stop ${t.name}?`, yes: "Stop", danger: true }))) return;
    }
    b.disabled = true;
    b.textContent = action === "start" ? "Starting…" : "Stopping…";
    try {
      await api(`/api/tools/${encodeURIComponent(t.id)}/${action}`, body);
      toast(action === "start" ? `${t.name} is starting.` : `${t.name} stopped.`);
      setTimeout(loadTools, 1500); setTimeout(loadTools, 6000);
    } catch (err) { toast(err.message, true); b.disabled = false; b.textContent = action === "start" ? "Start" : "Stop"; }
  };
}
async function loadTools() {
  const r = await api("/api/tools");
  S.tools = r.tools; S.themes = r.themes;
  if (S.tab === "tools" && document.activeElement?.id !== "toolQ") renderTools();
}

// ---------- PC ----------
function meter(label, pct, text) {
  const p = Math.max(0, Math.min(100, pct || 0));
  return `<div class="meter"><div class="lab"><span>${esc(label)}</span><b>${esc(text)}</b></div>
    <div class="track"><div class="fill ${p >= 90 ? "b" : p >= 70 ? "w" : ""}" style="width:${p}%"></div></div></div>`;
}
function renderPC() {
  const m = $("#main");
  const o = S.ov;
  if (!o) { m.innerHTML = `<div class="empty">Loading…</div>`; return; }
  const gb = mb => (mb / 1024).toFixed(1) + " GB";
  const sys = o.sys || {}, g = o.gpu;
  let html = `<h2 class="sec">This PC</h2><div class="card">`
    + meter("CPU", sys.cpu, Math.round(sys.cpu || 0) + "%")
    + meter("RAM", sys.mem_total ? sys.mem_used / sys.mem_total * 100 : 0, `${gb(sys.mem_used || 0)} of ${gb(sys.mem_total || 0)}`);
  if (g) html += meter("GPU", g.util, g.util + "%") + meter("VRAM", g.mem_total ? g.mem_used / g.mem_total * 100 : 0, `${gb(g.mem_used)} of ${gb(g.mem_total)}`)
    + `<div class="faint" style="margin-top:6px">${esc(g.name)} · ${g.temp}°C · ${Math.round(g.power)} W</div>`;
  html += `<div class="btns"><button class="btn small" id="freeGpu">Free GPU (unload Ollama)</button></div></div>`;
  const u = o.usage;
  if (u && (u.five_hour || u.seven_day)) {
    const reset = s => s ? " · resets " + new Date(s * 1000).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : "";
    html += `<h2 class="sec">Claude usage</h2><div class="card">`
      + (u.five_hour ? meter("5 hours" + reset(u.five_hour.resets_at), u.five_hour.pct, Math.round(u.five_hour.pct) + "%") : "")
      + (u.seven_day ? meter("7 days" + reset(u.seven_day.resets_at), u.seven_day.pct, Math.round(u.seven_day.pct) + "%") : "")
      + (u.age_secs > 1800 ? `<div class="faint">Last updated ${ago(Date.now() - u.age_secs * 1000)}</div>` : "") + `</div>`;
  }
  const items = o.inbox || [];
  html += `<h2 class="sec">Claude activity</h2>` + (items.length ? items.slice(0, 15).map(i => `<button class="card" style="width:100%;text-align:left;display:block" data-inbox="${esc(i.id)}">
      <div class="row"><div class="grow title">${esc(i.title || i.project || base(i.cwd))}</div>${i.kind === "waiting" ? `<span class="chip warn">Waiting</span>` : `<span class="chip live">Done</span>`}</div>
      <div class="sub ${i.brief ? "" : "clip2"}" style="margin-top:4px">${esc(i.brief || (i.text || "").slice(0, 240))}</div>
      <div class="faint" style="margin-top:4px">${esc(i.project || base(i.cwd))} · ${ago(i.at * 1000)}</div></button>`).join("") : `<div class="empty">No replies yet.</div>`);
  m.innerHTML = html;
  m.onclick = async e => {
    if (e.target.closest("#freeGpu")) {
      try { const r = await api("/api/gpu/free", {}); toast(r.unloaded?.length ? `Unloaded ${r.unloaded.map(x => x.name).join(", ")}.` : "Ollama had nothing loaded."); setTimeout(loadOverview, 1200); }
      catch (err) { toast(err.message, true); }
      return;
    }
    const ib = e.target.closest("[data-inbox]");
    if (ib) {
      const i = items.find(x => x.id === ib.dataset.inbox);
      const c = (S.chats || []).find(c => c.session_id === i.session_id);
      if (c) openChat(c);
      else if (i.session_id) openChat({ id: "", session_id: i.session_id, cwd: i.cwd, name: i.title || i.project });
    }
  };
}
async function loadOverview() {
  S.ov = await api("/api/overview");
  checkPage();
  renderBadges();
  if (S.tab === "pc") renderPC();
  if (S.tab === "chats" && !S.chat) renderChats();
}

// A tool page needs the hangar_tool cookie, which only a paired page can mint. A signed-out
// load of /t/<id>/... comes back here as #open=<id>&path=<p>; we mint once and go back.
// If the browser drops the cookie, the second bounce within 8 s stops with a message
// instead of looping.
const OPEN_TRY = "hangarOpenTry";
const openTry = {
  get() { try { return JSON.parse(sessionStorage.getItem(OPEN_TRY) || "null"); } catch { return null; } },
  set(v) { try { v ? sessionStorage.setItem(OPEN_TRY, JSON.stringify(v)) : sessionStorage.removeItem(OPEN_TRY); } catch {} },
};
function toolName(id) {
  const t = (S.ov?.open_tools || []).find(x => x.id === id) || (S.tools || []).find(x => x.id === id);
  return t ? t.name : "this tool";
}
// Only ever /t/<id><path>: path must start with "/" (not "//", no backslash, no control
// characters) and must stay inside /t/<id>/ once the browser resolves it; otherwise "/".
function toolHref(id, path) {
  const root = "/t/" + encodeURIComponent(id);
  let p = String(path || "/");
  if (!p.startsWith("/") || p.startsWith("//") || /[\\\u0000-\u001f\u007f]/.test(p)) p = "/";
  try {
    const u = new URL(root + p, location.origin);
    if (u.origin !== location.origin || !u.pathname.startsWith(root + "/")) p = "/";
  } catch { p = "/"; }
  return root + p;
}
// tapped: you pressed Open or a tile, so an earlier try no longer counts.
async function openTool(id, path = "/", tapped = false) {
  id = String(id || "");
  if (!/^[A-Za-z0-9_-]+$/.test(id)) { toast("Couldn't open that link.", true); return false; }
  const href = toolHref(id, path);
  const now = Date.now();
  const last = tapped ? null : openTry.get();
  if (last && last.id === id && now - last.at >= 0 && now - last.at < 8000) {
    openTry.set(null);
    toast(`Couldn't open ${toolName(id)}: this browser didn't keep Hangar's sign-in. Try again from the Tools tab.`, true);
    return false;
  }
  openTry.set({ id, at: now });
  try {
    await api("/api/tool-session", {});
  } catch (e) {
    openTry.set(null);
    if (!token) pendingLink = () => openTool(id, path); // unpaired: finish after pairing
    toast(`Couldn't open ${toolName(id)}: ${e.message}`, true);
    return false;
  }
  // Stamp again: a slow mint over cellular must not use up the 8 s window before we even leave.
  openTry.set({ id, at: Date.now() });
  location.assign(href);
  return true;
}

// ---------- Links: #chat=<session id>&cwd=<folder>, #open=<tool id>&path=<p>, #job=<id>&cwd=<folder>&name=<n> ----------
let pendingOpen = null;
let pendingLink = null; // an #open or #job link waiting for this phone to be paired
function runPendingLink() {
  const go = pendingLink;
  pendingLink = null;
  if (go) go();
}
function openFromLink(url) {
  const h = String(url || "").split("#")[1] || "";
  const p = new URLSearchParams(h);
  if (p.get("open") || p.get("job")) {
    history.replaceState(null, "", "/");
    pendingLink = p.get("open")
      ? () => openTool(p.get("open"), p.get("path") || "/")
      : () => openNewChat(p.get("job"), p.get("cwd") || "", p.get("name") || "", "Report sent");
    if (token) runPendingLink();
    return;
  }
  if (!p.get("chat")) return;
  pendingOpen = { session_id: p.get("chat"), cwd: p.get("cwd") || "" };
  history.replaceState(null, "", "/");
  if (S.chats) openPending();
}
function openPending() {
  if (!pendingOpen) return;
  const want = pendingOpen;
  pendingOpen = null;
  if (S.tab !== "chats") setTab("chats");
  const c = (S.chats || []).find(c => c.session_id === want.session_id);
  openChat(c || { id: "", session_id: want.session_id, cwd: want.cwd, name: base(want.cwd) });
}
const LINK = /(^|[#&])(chat|open|job)=/;
addEventListener("hashchange", () => { if (LINK.test(location.hash)) openFromLink(location.href); });

// ---------- Page updates ----------
// A Home Screen app coming back from the background keeps the page it loaded, maybe days ago, so a
// Hangar update would never reach the phone. Hangar stamps the page it serves here and reports its current one in
// /api/overview; when they differ the page reloads at the next quiet moment (nothing being typed,
// sent or filled in) and comes back in the chat that was open.
const PAGE_VERSION = "__HANGAR_PAGE_VERSION__";
function checkPage() {
  const now = S.ov && S.ov.page;
  if (!now || now === PAGE_VERSION || PAGE_VERSION.startsWith("__")) return;
  if (typing() || replyBusy || $("#chatIn")?.value.trim() || S.attach.reply.length || S.attach.fresh.length) return;
  if (T) return; // not in the middle of answering something in the Terminal
  if (!$("#dialog").classList.contains("hidden") || document.querySelector("body > .sheet:not(.hidden):not(#chatSheet)")) return;
  const ch = S.chat;
  history.replaceState(null, "", ch && ch.session_id ? `/#chat=${encodeURIComponent(ch.session_id)}&cwd=${encodeURIComponent(ch.cwd || "")}` : "/");
  location.reload();
}

// ---------- Refresh loop ----------
async function loadChats() {
  S.chats = await api("/api/chats");
  if (S.waitingNew && S.chat && S.chat.id === S.waitingNew) {
    const c = S.chats.find(x => x.id === S.waitingNew);
    if (c && c.session_id) { S.chat.session_id = c.session_id; S.chat.cwd = c.cwd || S.chat.cwd; S.waitingNew = null; loadChat(true); }
  }
  if (S.tab === "chats" && !S.chat) renderChats();
  if (S.chat) paintChatHead();
  renderBadges();
  openPending();
}
let busy = false;
async function refresh() {
  if (!token || busy || document.hidden) return;
  busy = true;
  try {
    const jobs = [loadChats(), loadOverview()];
    if (S.tab === "tools") jobs.push(loadTools());
    await Promise.allSettled(jobs);
    if (S.tab === "pc") renderPC();
  } finally { busy = false; }
}
let timers = [];
function start() {
  timers.forEach(clearInterval);
  timers = [
    setInterval(refresh, 7000),
    setInterval(() => { if (S.chat && !document.hidden) { loadChat(false); if (S.waitingNew) loadChats(); } }, 2500),
  ];
  setTab(S.tab);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  refresh();
  if (S.chat) loadChat(false);
  // Back from the background: the terminal's stream may have died meanwhile.
  if (T && !T.live && !T.ended) { clearTimeout(T.retry); T.retry = 0; termConnect(); }
});
// iOS back-swipe from a tool page restores this page from the back-forward cache as it was left,
// with Open still showing "Opening…" and disabled. Draw the Tools tab fresh, and since we're back
// without an #open link, the earlier open has finished (same rule as the boot below).
addEventListener("pageshow", e => {
  if (!e.persisted) return;
  if (!/(^|[#&])open=/.test(location.hash)) openTry.set(null);
  if (S.tab === "tools" && S.tools) renderTools();
});

// ---------- Boot ----------
const hashCode = (location.hash.match(/pair=(\d{6})/) || [])[1];
// Landing here without an #open link means an earlier tool open has finished.
if (!/(^|[#&])open=/.test(location.hash)) openTry.set(null);
if (LINK.test(location.hash)) openFromLink(location.href);
if (hashCode && !token) { $("#pairCode").value = hashCode; showPair(); doPair(hashCode); }
else if (!token) showPair();
else start();
</script>
